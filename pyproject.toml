[project]
name = "italian-phone-asr"
version = "0.1.0"
description = "Fine-tuning and benchmarking ASR on 8 kHz G.711 Italian phone speech, with entity accuracy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "jiwer>=3.1",
    "num2words>=0.5.14",
    "numpy>=1.26",
]

[project.optional-dependencies]
# cloud STT providers + audio I/O (bench run)
providers = ["httpx>=0.27", "soundfile>=0.12", "python-dotenv>=1.0"]
# local Whisper (base + LoRA), CPU inference
local = ["torch>=2.4", "transformers>=4.46", "peft>=0.13", "accelerate>=1.0", "soundfile>=0.12", "librosa>=0.10", "onnx-asr[cpu,hub]>=0.12"]
# open TTS voices for train_synth
tts = ["piper-tts>=1.3", "kokoro>=0.9", "soundfile>=0.12", "torch>=2.4"]
# browser recording server for test_human (Twilio Voice JS SDK)
recorder = ["fastapi>=0.115", "python-multipart>=0.0.9", "uvicorn>=0.30", "twilio>=9.3", "httpx>=0.27", "python-dotenv>=1.0", "soundfile>=0.12"]

[project.scripts]
bench = "iphasr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iphasr"]

[dependency-groups]
dev = ["pytest>=8.3", "fastapi>=0.115", "python-multipart>=0.0.9", "httpx>=0.27", "twilio>=9.3", "python-dotenv>=1.0", "soundfile>=0.12"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
